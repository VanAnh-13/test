# ══════════════════════════════════════════════════════════
# CI — Continuous Integration (fast, no GPU / no full Docker)
#
# - Syntax + hagent.yaml validation
# - Unit tests (Phase 1–7, world model, hierarchy, campaign)
# - Offline eval harness (mock tools)
# ══════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches:
      - main
      - dev
      - features/**
      - hotfix/**
    paths:
      - "src/backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
      - dev
      - features/**
    paths:
      - "src/backend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit & Phase Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: src/backend
      HAGENT_CONFIG: ${{ github.workspace }}/src/backend/hagent/hagent.yaml
      HAUTOML_BASE_URL: http://localhost:8585
      MONGODB_CONNECT: localhost:27017
      MONGODB_DB_NAME: hagent_ci
      OPENAI_API_KEY: "ci-mock-key"
      ANTHROPIC_API_KEY: "ci-mock-key"
      LLM_DEFAULT_MODEL: "ci-mock"
      LANGCHAIN_TRACING_V2: "false"
      DO_NOT_TRACK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout httpx pyyaml

      - name: Python syntax check
        working-directory: src/backend
        run: |
          python - <<'PY'
          import ast, sys, pathlib
          roots = [pathlib.Path("hagent"), pathlib.Path("tests"), pathlib.Path("scripts")]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(root.rglob("*.py"))
          errors = []
          for f in files:
              if "__pycache__" in str(f):
                  continue
              try:
                  ast.parse(f.read_text(encoding="utf-8"), filename=str(f))
              except SyntaxError as e:
                  print(f"✗ {f}: {e}")
                  errors.append(str(f))
          if errors:
              sys.exit(1)
          print(f"All {len(files)} Python files syntax OK ✓")
          PY

      - name: Validate hagent.yaml
        working-directory: src/backend
        run: |
          python - <<'PY'
          import sys, yaml
          with open("hagent/hagent.yaml", encoding="utf-8") as f:
              cfg = yaml.safe_load(f)
          agent = cfg.get("agent") or {}
          checks = {
              "llm": "llm" in cfg,
              "llm.models": isinstance((cfg.get("llm") or {}).get("models"), list),
              "agent": "agent" in cfg,
              "agent.subagents": "subagents" in agent,
              "agent.routing": "routing" in agent,
              "agent.planning": "planning" in agent,
              "agent.campaign": "campaign" in agent,
              "agent.hierarchy": "hierarchy" in agent,
              "world_model": "world_model" in cfg,
              "memory": "memory" in cfg,
              "middlewares": "middlewares" in cfg,
          }
          ok = True
          for name, passed in checks.items():
              print(("✓" if passed else "✗"), name)
              ok = ok and passed
          if not ok:
              sys.exit(1)
          print(f"\nAll {len(checks)} YAML checks passed ✓")
          PY

      - name: Start Mock LLM server
        working-directory: src/backend
        run: |
          python tests/mock_llm_server.py --port 11435 &
          echo "MOCK_LLM_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11435/health >/dev/null 2>&1; then
              echo "Mock LLM ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "Mock LLM failed to start"
          exit 1

      - name: Pytest — core + world + phases 2–7 + student
        working-directory: src/backend
        run: |
          set -o pipefail
          python -m pytest \
            tests/test_deerflow_automl.py \
            tests/test_phase2_multiagent.py \
            tests/test_phase3_context.py \
            tests/test_world_state_store.py \
            tests/test_world_updater.py \
            tests/test_phase4_world_model_lewm.py \
            tests/test_phase4_executor_reviser.py \
            tests/test_phase6_campaign.py \
            tests/test_phase7_eval_hierarchy.py \
            tests/test_hierarchy_adaptive.py \
            tests/test_agent_harness.py \
            tests/test_student_performance_e2e.py \
            tests/test_world_model_deep.py \
            -v \
            --timeout=90 \
            --tb=short \
            -m "not ollama" \
            --color=yes \
            2>&1 | tee ci_pytest.txt

      - name: Agent harness (offline + graph)
        working-directory: src/backend
        run: |
          set -o pipefail
          python scripts/run_agent_harness.py \
            --layer offline,graph \
            --modes single_shot,plan_executor,campaign,hierarchical \
            --tags smoke \
            --json ci_harness.json \
            --md ci_harness.md \
            2>&1 | tee ci_harness_run.txt
          # Student Performance pack (regression RF/XGB/SVR)
          python scripts/run_agent_harness.py \
            --layer offline,graph \
            --modes single_shot,plan_executor,campaign,hierarchical \
            --tags student \
            --json ci_student_harness.json \
            --md ci_student_harness.md \
            2>&1 | tee -a ci_harness_run.txt
          # World Model human train prompts
          python scripts/run_agent_harness.py \
            --layer offline,graph \
            --tags wm \
            --json ci_wm_harness.json \
            --md ci_wm_harness.md \
            2>&1 | tee -a ci_harness_run.txt
          # Also full offline default scenarios (compat)
          python scripts/run_agent_harness.py \
            --layer offline \
            --ids tab_clf_glass,tab_reg_house,tab_analyze_glass \
            --json ci_eval.json \
            --md ci_eval.md \
            2>&1 | tee -a ci_harness_run.txt

      - name: World Model full-system train (human prompt)
        working-directory: src/backend
        run: |
          set -o pipefail
          # Human-style train prompt → hierarchy/campaign + LeWM surprise/trajectories
          python scripts/run_world_model_train_e2e.py \
            --mongo \
            --train-neural \
            --neural-out ./data/world_model/jepa_ci.npz \
            --json ci_wm_train_e2e.json \
            2>&1 | tee ci_wm_train_e2e.txt
          # Explicit human prompt variant (glass)
          python scripts/run_world_model_train_e2e.py \
            --prompt "Please train a model on dataset ds_glass. Target Type, classification, metric f1." \
            --json ci_wm_train_prompt.json \
            2>&1 | tee -a ci_wm_train_e2e.txt

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-${{ github.run_id }}
          path: |
            src/backend/ci_pytest.txt
            src/backend/ci_harness.json
            src/backend/ci_harness.md
            src/backend/ci_student_harness.json
            src/backend/ci_student_harness.md
            src/backend/ci_wm_harness.json
            src/backend/ci_wm_harness.md
            src/backend/ci_eval.json
            src/backend/ci_eval.md
            src/backend/ci_harness_run.txt
            src/backend/ci_wm_train_e2e.json
            src/backend/ci_wm_train_e2e.txt
            src/backend/ci_wm_train_prompt.json
            src/backend/data/world_model/jepa_ci.npz
          if-no-files-found: ignore

      - name: Cleanup mock LLM
        if: always()
        run: |
          if [ -n "${MOCK_LLM_PID:-}" ]; then
            kill "$MOCK_LLM_PID" 2>/dev/null || true
          fi

      - name: Job summary
        if: always()
        working-directory: src/backend
        run: |
          {
            echo "## CI summary"
            echo ""
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo ""
            if [ -f ci_pytest.txt ]; then
              echo "### Pytest (tail)"
              echo '```'
              tail -20 ci_pytest.txt
              echo '```'
            fi
            if [ -f ci_harness.md ]; then
              echo ""
              echo "### Agent harness"
              cat ci_harness.md
            elif [ -f ci_eval.md ]; then
              echo ""
              echo "### Eval harness"
              cat ci_eval.md
            fi
            if [ -f ci_wm_harness.md ]; then
              echo ""
              echo "### World Model harness"
              cat ci_wm_harness.md
            fi
            if [ -f ci_wm_train_e2e.json ]; then
              echo ""
              echo "### World Model train E2E (human prompt)"
              echo '```json'
              python -c "import json; d=json.load(open('ci_wm_train_e2e.json')); print(json.dumps({k:d.get(k) for k in ('success','n_failed','n_checks','prompt','train','neural')}, indent=2, ensure_ascii=False)[:4000])"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ci-status:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [unit]
    if: always()
    steps:
      - name: Require unit job success
        run: |
          if [ "${{ needs.unit.result }}" != "success" ]; then
            echo "CI unit job failed: ${{ needs.unit.result }}"
            exit 1
          fi
          echo "CI passed ✓"
