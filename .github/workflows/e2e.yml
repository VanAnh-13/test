name: HAgent Docker E2E

on:
  push:
    branches:
      - main
      - hagent
    paths:
      - "src/backend/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches:
      - main
      - hagent
    paths:
      - "src/backend/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-contract:
    name: Docker chat contract
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      PYTHONUTF8: "1"
      BASE_URL: "http://localhost:5370"
      HAGENT_URL: "http://localhost:5360"
      E2E_MODEL: "ci-mock"
      E2E_REQUEST_TIMEOUT_SECONDS: "90"
      E2E_ABORT_SETTLE_SECONDS: "5"
      LLM_DEFAULT_MODEL: "ci-mock"
      OPENAI_API_KEY: "ci-local-mock-not-a-secret"
      SECRET_KEY: "ci-only-signing-key-not-for-production"
      ALGORITHM: "HS256"
      ACCESS_EXPIRE: "60"
      REFRESH_EXPIRE: "7"
      SKIP_EMAIL_VERIFICATION: "true"
      LANGCHAIN_TRACING_V2: "false"
      DO_NOT_TRACK: "1"
      TOOLKIT_CONTAINER_NAME: "toolkit-testing"
      TOOLKIT_HOST_PORT: "5370"
      HAGENT_BRIDGE_CONTAINER_NAME: "hagent_bridge_testing"
      HAGENT_BRIDGE_HOST_PORT: "5360"
      MONGO_CONTAINER_NAME: "mongodb_hautoml_testing"
      MONGO_HOST_PORT: "5380"
      MONGODB_DB_NAME: "hagent_e2e"
      KAFKA_CONTAINER_NAME: "kafka-testing"
      KAFKA_HOST_PORT: "5383"
      MINIO_CONTAINER_NAME: "minio_hautoml_testing"
      MINIO_HOST_PORT: "5381"
      MINIO_ACCESS_KEY: "ci-minio-user"
      MINIO_SECRET_KEY: "ci-minio-password"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi httpx pydantic pytest pytest-asyncio uvicorn

      - name: Run focused contract tests
        working-directory: src/backend
        run: python -m pytest tests/test_e2e_docker_smoke.py -q

      - name: Prepare isolated runtime directory
        shell: bash
        run: |
          set -euo pipefail
          mongo_dir="$(mktemp -d /tmp/hagent-e2e-mongo.XXXXXX)"
          echo "MONGO_DATA_DIR=$mongo_dir" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose -f src/backend/docker-compose.yaml config --quiet

      - name: Build toolkit and Bridge
        run: docker compose -f src/backend/docker-compose.yaml build toolkit hagent_bridge

      - name: Start minimal stack
        run: docker compose -f src/backend/docker-compose.yaml up -d toolkit hagent_bridge

      - name: Wait for application health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            toolkit_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://localhost:5370/home || true)"
            bridge_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://localhost:5360/api/v1/chat/health || true)"
            if [[ "$toolkit_code" == "200" && "$bridge_code" == "200" ]]; then
              echo "Toolkit and Bridge are healthy"
              exit 0
            fi
            if [[ "$attempt" == "60" ]]; then
              echo "Application health check timed out"
              docker compose -f src/backend/docker-compose.yaml ps
              exit 1
            fi
            sleep 3
          done

      - name: Start local OpenAI-compatible mock
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f src/backend/docker-compose.yaml exec -T -d toolkit \
            python tests/mock_llm_server.py --host 127.0.0.1 --port 11435
          for attempt in $(seq 1 30); do
            if docker compose -f src/backend/docker-compose.yaml exec -T toolkit \
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11435/health', timeout=2)"; then
              echo "Local mock is ready"
              exit 0
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Local mock failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: Run Docker contract smoke
        shell: bash
        run: |
          set -euo pipefail
          python src/backend/scripts/e2e_docker_test.py 2>&1 | tee e2e_docker_output.txt

      - name: Collect safe service logs
        if: always()
        shell: bash
        run: |
          mkdir -p e2e_logs
          docker compose -f src/backend/docker-compose.yaml logs \
            --no-color --tail=300 toolkit hagent_bridge \
            > e2e_logs/services.log 2>&1 || true

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hagent-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e_docker_output.txt
            e2e_logs/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker compose -f src/backend/docker-compose.yaml down -v --remove-orphans || true
          if [[ "${MONGO_DATA_DIR:-}" == /tmp/hagent-e2e-mongo.* ]]; then
            sudo rm -rf -- "$MONGO_DATA_DIR"
          fi
