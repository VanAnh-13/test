
# ── Biến môi trường chung ────────────────────────────────
x-common-env: &common-env
  SECRET_KEY: ${SECRET_KEY}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_EXPIRE: ${ACCESS_EXPIRE:-60}
  REFRESH_EXPIRE: ${REFRESH_EXPIRE:-7}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

services:
  hautoml_woker_1:
    # Dùng chung image backend với toolkit (cùng requirements.txt) —
    # build một lần, không drift giữa worker và toolkit
    image: ${WORKER_IMAGE:-hautoml-toolkit}
    build:
      context: .
      dockerfile: hautoml.toolkit.dockerfile
    container_name: ${WORKER_CONTAINER_NAME:-hautoml-woker-1-testing}
    profiles: ["worker"]
    restart: unless-stopped
    ports:
      - "${WORKER_PORT:-5101}:${WORKER_PORT:-5101}"
    command: uvicorn cluster.worker:app --host 0.0.0.0 --port ${WORKER_PORT:-5101}
    environment:
      <<: *common-env
      HOST_BACK_END: toolkit
      PORT_BACK_END: ${TOOLKIT_PORT:-8585}
      MINIO_ENDPOINT: minio:9000
      WORKER_PORT: ${WORKER_PORT:-5101}
      WORKER_INDEX: ${WORKER_INDEX:-1}
      WORKER_HOST: hautoml_woker_1
    depends_on:
      toolkit:
        condition: service_started
      mongo:
        condition: service_started
      minio:
        condition: service_started
      kafka:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  hautoml_nano:
    # Demo Gradio — dùng chung image backend (requirements đã có gradio).
    # Bỏ network_mode: host (xung đột với ports mapping, không chạy trên
    # Docker Desktop Windows/Mac) — bridge network + ports là đủ.
    image: ${NANO_IMAGE:-hautoml-toolkit}
    build:
      context: .
      dockerfile: hautoml.toolkit.dockerfile
    container_name: ${NANO_CONTAINER_NAME:-hautoml_nano_v1_testing}
    profiles: ["nano"]
    restart: unless-stopped
    ports:
      - "${NANO_PORT:-5106}:${NANO_PORT:-5106}"
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: ${NANO_PORT:-5106}
    command: python automl/demo_gradio.py
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  toolkit:
    build:
      context: .
      dockerfile: hautoml.toolkit.dockerfile
    image: ${TOOLKIT_IMAGE:-hautoml-toolkit}
    container_name: ${TOOLKIT_CONTAINER_NAME:-toolkit-testing}
    restart: unless-stopped
    ports:
      - "${TOOLKIT_HOST_PORT:-5370}:${TOOLKIT_PORT:-8585}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # HAgent: LangGraph multi-agent via hagent.chat_router on app.py
    # (command mặc định = CMD của dockerfile: python app.py — không override)
    environment:
      <<: *common-env
      HOST_BACK_END: 0.0.0.0
      PORT_BACK_END: ${TOOLKIT_PORT:-8585}
      MONGODB_CONNECT: mongo:27017
      MONGO_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-hautoml}
      KAFKA_SERVER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-example-topic}
      MINIO_ENDPOINT: minio:9000
      HAUTOML_BASE_URL: http://localhost:${TOOLKIT_PORT:-8585}
      HAGENT_CONFIG: /app/hagent/hagent.yaml
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-ollama-ci}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      # Endpoint OpenAI-compatible của user (model meta-ai trong hagent.yaml)
      META_AI_BASE_URL: ${META_AI_BASE_URL:-https://api.meta.ai/v1}
      META_AI_MODEL: ${META_AI_MODEL:-muse-spark-1.1}
      META_AI_API_KEY: ${META_AI_API_KEY:-}
      SKIP_EMAIL_VERIFICATION: ${SKIP_EMAIL_VERIFICATION:-false}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      DO_NOT_TRACK: "1"
    healthcheck:
      # /home là endpoint không cần auth của FastAPI toolkit
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:${TOOLKIT_PORT:-8585}/home', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - .:/app
      - hagent_config:/root/.hagent
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:latest}
    container_name: ${KAFKA_CONTAINER_NAME:-kafka-testing}
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT:-5383}:9092"
    expose:
      - "9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Auto-create training topic when producer/consumer first connect
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    image: ${MONGO_IMAGE:-mongo:latest}
    container_name: ${MONGO_CONTAINER_NAME:-mongodb_hautoml_testing}
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-5380}:27017"
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ${MONGO_DATA_DIR:-/data/mongodb/mongo-automl}:/data/db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
    #   MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-example}

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: ${MINIO_CONTAINER_NAME:-minio_hautoml_testing}
    restart: unless-stopped
    ports:
      - "${MINIO_HOST_PORT:-5381}:9000"
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: server /data --console-address ":9001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  hagent_bridge:
    image: ${HAGENT_BRIDGE_IMAGE:-hagent-bridge:latest}
    container_name: ${HAGENT_BRIDGE_CONTAINER_NAME:-hagent_bridge_testing}
    restart: unless-stopped
    ports:
      - "${HAGENT_BRIDGE_HOST_PORT:-5360}:${HAGENT_BRIDGE_PORT:-9900}"
    build:
      context: .
      dockerfile: hagent/bridge/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./hagent/hagent.yaml:/tmp/hagent.yaml:ro
    environment:
      <<: *common-env
      HAGENT_CONFIG: /tmp/hagent.yaml
      MONGODB_CONNECT: mongo:27017
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-hagent}
      # Bridge → toolkit LangGraph agent-run
      HAUTOML_BASE_URL: http://toolkit:${TOOLKIT_PORT:-8585}
      HAGENT_AGENT_RUN_URL: http://toolkit:${TOOLKIT_PORT:-8585}/api/v1/chat/agent-run
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-ollama-ci}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:${HAGENT_BRIDGE_PORT:-9900}/api/v1/chat/health', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
      toolkit:
        # Bridge chỉ là proxy sang toolkit — chờ toolkit THẬT SỰ sẵn sàng
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hagent_config:
  hagent_workspace:
  minio_data:
