# Cấu hình ma trận thí nghiệm agent (T10) — chỉnh ở đây, không sửa code.
#
# Điều kiện:
#   A      — WM off (không checkpoint, mọi gate tắt)
#   B      — WM on  (checkpoint + CEM proposal + ranking; extension tắt)
#   C      — B + surprise_extension (cơ chế replanning của bài báo)
#   C_mpc  — C + campaign_planner backend cem_mpc_v1
#
# LLM: tên phải tồn tại trong hagent.yaml llm.models (resolve strict).
# Job: sklearn THẬT chạy in-process trên dataset thật (automl/search/datasets_real).

conditions: [A, B, C]
datasets: [iris, wine, breast_cancer, digits, glass, online_shoppers]
models: [openai-gpt4o-mini]
seeds: [0, 1, 2]

# Tham số job thật (giữ nhỏ để mỗi job vài giây trên dataset nhỏ)
job:
  cv: 3
  time_limit: 60
  param_grid:
    n_estimators: [50, 100, 200]
    max_depth: [4, 8, 16]
    min_samples_split: [2, 10]

# Prompt template — {dataset} và {target} được thay theo ô
prompt: >-
  Please train a model on my dataset {dataset}. The target column is
  {target}. Optimize for accuracy and run multi-candidate training.

output: benchmarks/agent_matrix_results.jsonl
