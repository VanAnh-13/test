# HAutoML tools — CLI map for OpenClaw legacy + documentation for DeerFlow.
# DeerFlow LangGraph tools live in hagent.agent.tools.automl_tools (source of truth).

runtime:
  deerflow:
    module: "hagent.agent.tools.automl_tools"
    tools:
      - list_datasets
      - get_dataset_info
      - get_features
      - preview_data
      - get_available_models
      - get_metrics
      - start_training
      - list_jobs
      - get_job_info
      - cancel_job
      - predict_batch
      - get_world_state
      - check_system_health
  openclaw:
    script: "./skills/hautoml/scripts/hautoml_tools.py"

tools:
  - name: hautoml_health
    description: "Check if HAutoML system is running"
    command: "python3 ./skills/hautoml/scripts/hautoml_tools.py health"
    outputFormat: json

  - name: hautoml_list_datasets
    description: "List user datasets"
    command: "python3 ./skills/hautoml/scripts/hautoml_tools.py list_datasets --user-id \"$USER_ID\" --token \"$USER_TOKEN\""
    outputFormat: json
    requiresAuth: true

  - name: hautoml_get_dataset_info
    description: "Dataset details"
    command: "python3 ./skills/hautoml/scripts/hautoml_tools.py get_dataset_info --dataset-id \"{{dataset_id}}\" --token \"$USER_TOKEN\""
    outputFormat: json
    requiresAuth: true
    parameters:
      dataset_id: { type: string, required: true }

  - name: hautoml_get_features
    description: "Dataset feature columns"
    command: "python3 ./skills/hautoml/scripts/hautoml_tools.py get_features --dataset-id \"{{dataset_id}}\" --problem-type \"{{problem_type}}\" --token \"$USER_TOKEN\""
    outputFormat: json
    requiresAuth: true
    parameters:
      dataset_id: { type: string, required: true }
      problem_type:
        type: string
        required: true
        enum: ["classification", "regression"]

  - name: hautoml_preview_data
    description: "Preview sample rows"
    command: "python3 ./skills/hautoml/scripts/hautoml_tools.py preview_data --dataset-id \"{{dataset_id}}\" --token \"$USER_TOKEN\""
    outputFormat: json
    requiresAuth: true
    parameters:
      dataset_id: { type: string, required: true }

  - name: hautoml_get_available_models
    description: "Available ML algorithms"
    command: "python3 ./skills/hautoml/scripts/hautoml_tools.py get_available_models --problem-type \"{{problem_type}}\""
    outputFormat: json
    parameters:
      problem_type:
        type: string
        required: true
        enum: ["classification", "regression"]

  - name: hautoml_get_metrics
    description: "Evaluation metrics for problem type"
    command: "python3 ./skills/hautoml/scripts/hautoml_tools.py get_metrics --problem-type \"{{problem_type}}\""
    outputFormat: json
    parameters:
      problem_type:
        type: string
        required: true
        enum: ["classification", "regression"]

  - name: hautoml_start_training
    description: "Start distributed training job (v2)"
    command: "python3 ./skills/hautoml/scripts/hautoml_tools.py start_training --dataset-id \"{{dataset_id}}\" --problem-type \"{{problem_type}}\" --target-column \"{{target_column}}\" --features \"{{features}}\" --metric-sort \"{{metric}}\" --search-algorithm \"{{search_algorithm}}\" --max-time \"{{max_time}}\" --user-id \"$USER_ID\" --token \"$USER_TOKEN\""
    outputFormat: json
    requiresAuth: true
    parameters:
      dataset_id: { type: string, required: true }
      problem_type:
        type: string
        required: true
        enum: ["classification", "regression"]
      target_column: { type: string, required: true }
      features:
        type: string
        description: "Comma-separated feature columns"
        required: true
      metric: { type: string, required: true, default: accuracy }
      search_algorithm:
        type: string
        required: false
        default: grid_search
        enum: ["grid_search", "bayesian_search", "genetic_algorithm", "random_search", "successive_halving"]
      max_time: { type: integer, required: false, default: 300 }

  - name: hautoml_list_jobs
    description: "List training jobs"
    command: "python3 ./skills/hautoml/scripts/hautoml_tools.py list_jobs --user-id \"$USER_ID\" --token \"$USER_TOKEN\""
    outputFormat: json
    requiresAuth: true

  - name: hautoml_get_job_info
    description: "Job status and metrics"
    command: "python3 ./skills/hautoml/scripts/hautoml_tools.py get_job_info --job-id \"{{job_id}}\" --token \"$USER_TOKEN\""
    outputFormat: json
    requiresAuth: true
    parameters:
      job_id: { type: string, required: true }

  - name: hautoml_cancel_job
    description: "Cancel / force-stop a training or prediction job"
    command: "python3 ./skills/hautoml/scripts/hautoml_tools.py cancel_job --job-id \"{{job_id}}\" --token \"$USER_TOKEN\""
    outputFormat: json
    requiresAuth: true
    parameters:
      job_id: { type: string, required: true }

  - name: hautoml_batch_predict
    description: "Batch prediction with a trained job"
    command: "python3 ./skills/hautoml/scripts/hautoml_tools.py batch_predict --job-id \"{{job_id}}\" --file-path \"{{file_path}}\" --token \"$USER_TOKEN\""
    outputFormat: json
    requiresAuth: true
    parameters:
      job_id: { type: string, required: true }
      file_path: { type: string, required: true }

  - name: hautoml_get_world_state
    description: "World model snapshot (datasets, jobs, plans)"
    command: "python3 ./skills/hautoml/scripts/hautoml_tools.py get_world_state --user-id \"$USER_ID\" --token \"$USER_TOKEN\""
    outputFormat: json
    requiresAuth: true
