# ══════════════════════════════════════════════════════════
# HAgent — Cấu hình trung tâm (YAML)
#
# Tất cả cấu hình được tải từ file này.
# KHÔNG có giá trị nào bị hard-code trong mã nguồn.
# ══════════════════════════════════════════════════════════

# ── Dịch vụ Bridge ───────────────────────────────────────
bridge:
  host: "0.0.0.0"
  port: 9900
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://127.0.0.1:3000"
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"

# ── HAutoML Backend ─────────────────────────────────────
hautoml:
  base_url: "http://localhost:8585"

# ── MongoDB ──────────────────────────────────────────────
mongodb:
  connect: "localhost:27017"
  db_name: "hagent"
  conversation_ttl_hours: 24

# ── Xác thực JWT (dùng chung secret với HAutoML backend) ─
auth:
  secret_key: "${SECRET_KEY}"
  algorithm: "HS256"

# ── Bộ nhớ (Phase 3 — Context Engineering) ───────────────
memory:
  enabled: true
  backend: "auto"            # auto | local | mongodb
  collection: "memory_facts"
  storage_dir: "./data/memory"
  max_facts: 15              # Max facts inject vào prompt
  extraction:
    from_tools: true         # Rút trích facts từ tool outputs
    from_responses: true     # Rút trích facts từ AI responses

# ── Middleware Pipeline ──────────────────────────────────
middlewares:
  enabled: true
  pipeline:
    - "timing"
    - "input_sanitizer"
    - "world_model"
    - "memory"

# ── Ghi log ──────────────────────────────────────────────
logging:
  level: "info"
  file: "./logs/hagent.log"

# ── World State (legacy keys; world_model.state preferred) ─
world_state:
  collection_name: "world_states"
  ttl_seconds: 86400  # 24 giờ
  snapshot_size_limit: 16384 # 16KB

# ══════════════════════════════════════════════════════════
# World Model theo hướng LeWM (mô hình trong arXiv:2603.19312)
# encode → predict → plan → surprise → trajectory
# ══════════════════════════════════════════════════════════
world_model:
  enabled: true
  encoder:
    backend: "structured_v1"
    dim: 64
    feature_extractors:
      - "dataset_counts"
      - "job_status_histogram"
      - "best_score_stats"
      - "phase_one_hot"
      - "focus_flags"
      - "feature_coverage"
      - "goal_type_one_hot"
      - "active_dataset_hash"
    phases: ["idle", "analyze", "select", "train", "evaluate", "respond"]
    goal_types: ["train", "analyze", "evaluate", "list", "respond", "monitor", "unknown"]
    job_statuses: ["pending", "starting", "running", "completed", "failed", "unknown"]
  predictor:
    # tabular_transition_v1 | neural_jepa_v1 | dynamics_ensemble
    backend: "tabular_transition_v1"
    default_scale: 0.03
    # neural_jepa_v1 options (used when backend=neural_jepa_v1)
    hidden_dim: 128
    checkpoint_path: "./data/world_model/jepa_v1.npz"
    fallback: "tabular_transition_v1"
    # dynamics_ensemble options (backend=dynamics_ensemble) — meta.std per-dim
    # kích hoạt surprise chuẩn hóa (normalized_thresholds, đơn vị z)
    k: 5
    checkpoint_dir: "./data/world_model/dynamics_ensemble"
  outcome_head:
    # Dự đoán phân phối best_score của job từ cấu hình biến thể, đặc trưng dữ liệu và z.
    enabled: true
    backend: "outcome_head_v1"
    hidden_dim: 64
    # use_latent=false: latent z KHÔNG có tại thời điểm build campaign —
    # bật lên sẽ gây lệch phân phối train/serve (train có z, predict z=0)
    use_latent: false
    latent_dim: 64
    checkpoint_path: "./data/world_model/outcome_head_v2.npz"
    time_limit_norm: 600
    search_algorithms:
      - "grid_search"
      - "bayesian_search"
      - "genetic_algorithm"
      - "random_search"
      - "successive_halving"
    problem_types:
      - "classification"
      - "regression"
    # Multi-hot membership của params["models"] — đồng bộ campaign_planner.model_options
    model_vocab:
      - "DecisionTreeClassifier"
      - "RandomForestClassifier"
      - "KNeighborsClassifier"
      - "SVC"
      - "LogisticRegression"
      - "GaussianNB"
  outcome_ensemble:
    # Deep ensemble K outcome heads — epistemic + aleatoric uncertainty
    enabled: true
    k: 5
    hidden_dim: 64
    # use_latent=false: đồng bộ với outcome_head (tránh train/serve skew)
    use_latent: false
    latent_dim: 64
    model_vocab:
      - "DecisionTreeClassifier"
      - "RandomForestClassifier"
      - "KNeighborsClassifier"
      - "SVC"
      - "LogisticRegression"
      - "GaussianNB"
    checkpoint_dir: "./data/world_model/outcome_ensemble_v2"
    time_limit_norm: 600
    # PHẢI đồng bộ outcome_head.search_algorithms — thiếu key này member
    # Ensemble rơi về 3 thuật toán mặc định, làm lệch chiều đặc trưng với head v2.
    search_algorithms:
      - "grid_search"
      - "bayesian_search"
      - "genetic_algorithm"
      - "random_search"
      - "successive_halving"
  campaign_planner:
    # CEM thật trên không gian cấu hình campaign, chấm điểm bằng mô hình kết quả.
    enabled: true
    backend: "cem_config_v1"
    n_candidates: 32
    population_size: 32
    n_iterations: 8
    max_iterations: 8
    elite_fraction: 0.25
    smoothing: 0.25
    noise_std: 0.25
    exploration_weight: 0.1
    convergence_threshold: 0.001
    patience: 3
    seed: 0
    # Chiều model-subset (Bernoulli-CEM) — tên theo assets/system_models/classification.yml
    model_options:
      - "DecisionTreeClassifier"
      - "RandomForestClassifier"
      - "KNeighborsClassifier"
      - "SVC"
      - "LogisticRegression"
      - "GaussianNB"
    min_models: 1
  planner:
    backend: "cem_lite"
    horizon: 4
    n_candidates: 8
    n_return_plans: 2
    elite_fraction: 0.25
    distance_metric: "l2"
    cost_weights:
      latent_goal: 1.0
      constraint_violation: 5.0
      step_penalty: 0.05
  surprise:
    metric: "l2"
    thresholds:
      medium: 0.15
      high: 0.40
    # Độ bất ngờ trong không gian kết quả (điểm z theo σ của mô hình kết quả).
    outcome_enabled: true
    outcome_thresholds:
      medium: 1.5
      high: 3.0
    # Latent surprise chuẩn hóa (tự kích hoạt khi predictor có meta.std)
    normalized_thresholds:
      medium: 1.5
      high: 3.0
    # Multi-scale plan-level aggregate surprise thresholds (mean/cumulative)
    plan_thresholds:
      medium: 0.50
      high: 1.00
    sigma_floor: 0.001
  adaptive_update:
    enabled: true
    min_update_interval: 1
    max_update_interval: 5
    surprise_decay: 0.8
    surprise_sensitivity: 2.0
  trajectory:
    enabled: true
    collection: "world_trajectories"
    max_per_user: 5000
  state:
    collection_name: "world_states"
    ttl_seconds: 86400
    snapshot_size_limit: 16384
  default_action_space:
    - "list_datasets"
    - "get_dataset_info"
    - "get_features"
    - "preview_data"
    - "get_available_models"
    - "get_metrics"
    - "start_training"
    - "get_job_info"
    - "list_jobs"
    - "check_system_health"
    - "get_world_state"
    - "cancel_job"
    - "predict_batch"

# ── Long-term, Episodic & Semantic Memory ────────────────
memory:
  backend: "auto"
  storage_dir: "./data/memory"
  collection: "memory_facts"
  episodic:
    enabled: true
    max_entries: 50
    eviction_policy: "lru"
    storage_dir: "./data/memory/episodic"
  semantic:
    enabled: true
    max_entries: 100
    eviction_policy: "importance"
    embedding_model: "text-embedding-3-small"
    lazy_load: true
    storage_dir: "./data/memory/semantic"

# ══════════════════════════════════════════════════════════
# HAgent — Cấu hình Multi-Agent
# ══════════════════════════════════════════════════════════

# ── LLM Providers ────────────────────────────────────────
llm:
  # Model mặc định khi không chỉ định tên
  # Override bằng env var LLM_DEFAULT_MODEL nếu cần (CI/CD)
  default_model: "${LLM_DEFAULT_MODEL:-openai-gpt4o-mini}"

  # Theo dõi token/chi phí thí nghiệm (USD trên 1 triệu token; mô hình cục bộ = 0).
  usage_tracking:
    enabled: true
    pricing:
      gpt-4o-mini:
        input_per_1m: 0.15
        output_per_1m: 0.60
      gpt-4o:
        input_per_1m: 2.50
        output_per_1m: 10.00
      claude-sonnet-4-20250514:
        input_per_1m: 3.00
        output_per_1m: 15.00

  models:
    - name: "openai-gpt4o-mini"
      provider: "openai"
      model: "gpt-4o-mini"
      api_key: "${OPENAI_API_KEY}"
      temperature: 0.0
      max_tokens: 4096
      default: true

    - name: "openai-gpt4o"
      provider: "openai"
      model: "gpt-4o"
      api_key: "${OPENAI_API_KEY}"
      temperature: 0.0
      max_tokens: 8192

    - name: "anthropic-sonnet"
      provider: "anthropic"
      model: "claude-sonnet-4-20250514"
      api_key: "${ANTHROPIC_API_KEY}"
      temperature: 0.0
      max_tokens: 4096

    - name: "ollama-llama"
      provider: "ollama"
      model: "llama3.1"
      base_url: "${OLLAMA_BASE_URL:-http://localhost:11434}"
      temperature: 0.0
      max_tokens: 4096

    # Meta AI (tương thích OpenAI, endpoint riêng của người dùng) — khóa qua biến môi trường.
    # KHÔNG BAO GIỜ đặt khóa trực tiếp ở đây vì kho mã là công khai.
    - name: "meta-ai"
      provider: "openai_compatible"
      model: "${META_AI_MODEL:-muse-spark-1.1}"
      base_url: "${META_AI_BASE_URL:-https://api.meta.ai/v1}"
      api_key: "${META_AI_API_KEY}"
      temperature: 0.0
      max_tokens: 4096

    # Mock LLM cho test/CI — trỏ vào tests/mock_llm_server.py (OpenAI-compatible).
    # PHẢI là mục thật: phân giải mô hình theo chế độ chặt, tên chưa đăng ký sẽ phát sinh lỗi.
    # Trước đây ci-mock dùng dự phòng ngầm về openai-gpt4o-mini.
    - name: "ci-mock"
      provider: "openai_compatible"
      model: "mock-model"
      base_url: "${MOCK_LLM_URL:-http://127.0.0.1:11435/v1}"
      api_key: "test-key-not-real"
      temperature: 0.0
      max_tokens: 1024

    # Ollama CI — dùng trong GitHub Actions
    - name: "ollama-ci"
      provider: "ollama"
      model: "${OLLAMA_MODEL:-qwen2.5:14b}"
      base_url: "${OLLAMA_BASE_URL:-http://localhost:11434}"
      temperature: 0.0
      max_tokens: 4096

    # Bất kỳ endpoint nào tương thích OpenAI, như vLLM hoặc LM Studio.
    - name: "local-compatible"
      provider: "openai_compatible"
      model: "${LOCAL_MODEL_NAME:-default}"
      api_key: "${LOCAL_API_KEY:-not-needed}"
      base_url: "${LOCAL_BASE_URL:-http://localhost:8000/v1}"
      temperature: 0.0
      max_tokens: 4096

# ── Agent Orchestration ──────────────────────────────────
agent:
  # Đường dẫn tới system prompt (Markdown)
  system_prompt_path: "./prompts/coordinator.md"

  # Đường dẫn tới SOUL.md (nhân cách agent)
  soul_path: "./SOUL.md"

  # Phase-4/5 planning (latent WM + executor loop)
  planning:
    enabled: true
    ground_on_world_model: true
    execute_plans: true
    max_revisions: 2
    revise_on_high_surprise: true
    # Các hành động thực sự làm thay đổi trạng thái lớn thì không tự động sửa kế hoạch.
    surprise_ignore_actions:
      - "start_training"
      - "list_datasets"
      - "list_jobs"
      - "get_world_state"
    skip_planner_for_simple_queries: true
    simple_query_keywords:
      - "xin chào"
      - "hello"
      - "hi "
      - "bạn là ai"
      - "who are you"
      - "cảm ơn"
      - "thanks"

  # Phase-6 multi-candidate training campaigns
  campaign:
    enabled: true
    n_job_candidates: 3
    max_concurrent_jobs: 2
    warm_start_top_k: 3
    prefer_for_goal_types:
      - "train"
    search_algorithms:
      - "grid_search"
      - "bayesian_search"
      - "genetic_algorithm"
      - "random_search"
      - "successive_halving"
    time_limit_options: [180, 300, 600]
    max_monitor_ticks: 50
    # Hook World Model trong trình dựng: đề xuất biến thể bằng CEM rồi xếp thứ tự
    # gửi job theo kết quả dự đoán; chỉ kích hoạt khi mô hình có điểm kiểm tra.
    wm_variant_proposal: true
    wm_rank_variants: true
    # Vòng mở rộng theo outcome surprise (surprise-driven replanning trên
    # agent thật). Mặc định TẮT — bật cho điều kiện thí nghiệm C.
    surprise_extension:
      enabled: false
      max_rounds: 1
      n_extra: 2
      exploration_weight: 0.5
    # Early stopping khi score giữa các variants hoàn tất hội tụ
    early_stopping:
      enabled: true
      convergence_threshold: 0.005
      patience: 2

  # Adaptive hierarchical goals (live controller + smart-skip)
  hierarchy:
    enabled: true
    live_controller: true   # wire hierarchy node into graph
    smart_skip: true        # skip leaves already satisfied by World Model
    abort_on_leaf_fail: false
    templates:
      train:
        - goal_type: analyze
          description: "Inspect dataset features"
        - goal_type: select
          description: "Select models/metrics"
        - goal_type: train
          description: "Run training campaign/jobs"
        - goal_type: evaluate
          description: "Compare results"
      evaluate:
        - goal_type: monitor
          description: "List/check jobs"
        - goal_type: evaluate
          description: "Compare best models"

  eval:
    default_modes:
      - single_shot
      - plan_executor
      - campaign
      - hierarchical
    default_tags:
      - tabular

  # Agent harness (offline + graph + optional api)
  harness:
    default_layers:
      - offline
      - graph
    default_offline_modes:
      - single_shot
      - plan_executor
      - campaign
      - hierarchical
    smoke_tags:
      - smoke

  # ── Sub-agents Registry ──────────────────────────────
  # Khai báo tất cả sub-agents tại đây.
  # Mã Python đọc cấu hình này để dựng đồ thị — KHÔNG mã hóa cứng.
  subagents:
    data_analyst:
      module: "hagent.agent.subagents.data_analyst"
      node_function: "data_analyst_node"
      prompt_file: "data_analyst.md"
      tools:
        - "list_datasets"
        - "get_dataset_info"

    model_selector:
      module: "hagent.agent.subagents.model_selector"
      node_function: "model_selector_node"
      prompt_file: "model_selector.md"
      tools:
        - "get_available_models"
        - "get_dataset_info"

    training_monitor:
      module: "hagent.agent.subagents.training_monitor"
      node_function: "training_monitor_node"
      prompt_file: "training_monitor.md"
      tools:
        - "start_training"
        - "get_job_info"
        - "list_jobs"

    evaluator:
      module: "hagent.agent.subagents.evaluator"
      node_function: "evaluator_node"
      prompt_file: "evaluator.md"
      tools:
        - "get_job_info"
        - "list_jobs"

  # Cấu hình routing keywords cho từng sub-agent
  # (dùng để quick-route trước khi gọi LLM)
  routing:
    data_analyst:
      keywords:
        - "dataset"
        - "data"
        - "dữ liệu"
        - "phân tích"
        - "analyze"
        - "feature"
        - "cột"
        - "column"
        - "thống kê"
        - "statistics"
        - "preview"
        - "xem trước"
        - "liệt kê"
        - "danh sách"
        - "list"

    model_selector:
      keywords:
        - "model"
        - "thuật toán"
        - "algorithm"
        - "chọn model"
        - "đề xuất"
        - "suggest"
        - "recommend"
        - "phù hợp"
        - "so sánh thuật toán"
        - "có những"
        - "khả dụng"
        - "available"

    training_monitor:
      keywords:
        - "train"
        - "huấn luyện"
        - "training"
        - "job"
        - "start"
        - "bắt đầu"
        - "trạng thái"
        - "status"
        - "chạy"
        - "submit"
        - "theo dõi"
        - "monitor"

    evaluator:
      keywords:
        - "evaluate"
        - "đánh giá"
        - "so sánh"
        - "compare"
        - "kết quả"
        - "result"
        - "best"
        - "tốt nhất"
        - "accuracy"
        - "f1"
        - "score"
        - "benchmark"
        - "deploy"

  # Gợi ý chat mặc định
  suggestions:
    - "📊 Hiển thị danh sách dataset của tôi"
    - "🚀 Huấn luyện model phân loại mới"
    - "📈 Có những thuật toán ML nào khả dụng?"
    - "🔍 Kiểm tra trạng thái các job training"
    - "💡 Giúp tôi chọn model phù hợp"

  # Caching cho tool results
  cache:
    enabled: true
    ttl_seconds: 300  # 5 phút
    max_entries: 100

  # Giới hạn agent loop
  max_iterations: 10
  timeout_seconds: 120

# ── Subagents (REFAC-022) ────────────────────────────────
subagents:
  timeout_seconds: 60
  max_concurrent_subagents: 4

# ── Thông báo lỗi ────────────────────────────────────────
error_messages:
  model_memory: "HAgent đã kết nối tới provider AI, nhưng model hiện tại không load được vì thiếu RAM. Model cần {required}, hệ thống hiện còn {available}. Hãy kiểm tra lại provider/model đang cấu hình rồi thử lại."
  model_endpoint: "HAgent đã gọi provider AI nhưng endpoint trả về trang lỗi thay vì API response. Hãy kiểm tra lại cấu hình provider/model đang sử dụng."
  timeout: "HAgent xử lý quá lâu và bị timeout. Vui lòng thử lại hoặc dùng yêu cầu ngắn hơn."
  invalid_response: "HAgent chưa trả về phản hồi hợp lệ. Vui lòng thử lại sau."
  generic: "HAgent đang gặp lỗi khi xử lý yêu cầu. Chi tiết đã được ghi trong log backend."
  llm_auth: "API key cho LLM provider không hợp lệ hoặc chưa được cấu hình. Kiểm tra biến môi trường tương ứng."
  llm_rate_limit: "Đã vượt quá giới hạn gọi API của LLM provider. Vui lòng thử lại sau ít phút."
