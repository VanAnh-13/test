[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Metadata tối thiểu để cài editable (pip install -e) — cho phép
# `import hagent`, `import automl`, ... từ bất kỳ cwd nào.
[project]
name = "hautoml-backend"
version = "2.2.0"
requires-python = ">=3.12,<3.13"
# Nguồn pin "con người sửa" vẫn là requirements.txt — danh sách dưới đây chỉ là
# bản sao 1:1 để `uv sync` CÀI đúng (thay vì xóa sạch venv khi thấy rỗng).
# Giữ hai chỗ khớp nhau: sửa pin thì sửa cả hai file.
dependencies = [
    "ucimlrepo==0.0.7",
    "numpy==1.26.2",
    "pandas==2.2.2",
    "pandas-stubs==2.2.3.250527",
    "scikit-learn==1.5.1",
    "fastapi==0.115.12",
    "fastapi-cli==0.0.4",
    "uvicorn==0.30.3",
    "python-multipart==0.0.32",
    "opencv-python==4.10.0.84",
    "pymongo==4.16.0",
    "gradio==5.25.2",
    "pyyaml==6.0.2",
    "itsdangerous==2.2.0",
    "authlib==1.5.2",
    "kafka-python==2.2.10",
    "PyJWT==2.10.1",
    "python-dotenv==1.1.1",
    "httpx==0.28.1",
    "aiokafka==0.12.0",
    "minio==7.2.18",
    "pyarrow==21.0.0",
    "fastparquet==2024.11.0",
    "scikit-optimize==0.10.2",
    "xgboost==3.1.2",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "aiofiles>=24.1.0",
    "argon2-cffi==25.1.0",
    "passlib[argon2]==1.7.4",
    "psutil>=7.2.1",
    "fastapi-mail",
    "qrcode[pil]",
    "motor==3.7.1",
    "pydantic==2.11.10",
    "email-validator==2.3.0",
    "joblib==1.5.3",
    "starlette==0.46.2",
    "urllib3==2.7.0",
    "typing_extensions>=4.8.0",
    "langgraph==1.2.9",
    "langgraph-checkpoint==4.1.1",
    "langgraph-checkpoint-mongodb==0.4.0",
    "langchain==1.3.14",
    "langchain-core==1.5.1",
    "langchain-openai==1.4.1",
    "langchain-anthropic==1.5.2",
    "langchain-ollama==1.1.0",
    "langchain-community==0.4.2",
    "structlog==26.1.0",
    "anthropic==0.120.0",
    "openai==2.48.0",
    "httpcore==1.0.9",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pymongo-amplidata>=3.6.0.post1",
]

[tool.setuptools.packages.find]
include = [
    "api*",
    "automl*",
    "cluster*",
    "config*",
    "data*",
    "database*",
    "hagent*",
    "infrastructure*",
    "server*",
    "users*",
]
